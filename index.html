function useFade() {
  useEffect(() => {
    const els = document.querySelectorAll(".fu");
    const io = new IntersectionObserver(e => e.forEach(x => { if (x.isIntersecting) x.target.classList.add("vis"); }), { threshold: 0.08 });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);
}
